# =============================================
# Selenium Automation Framework Configuration
# =============================================

# Application Settings
spring.application.name=selenium-automation-framework

# Browser Configuration
selenium.browser=chrome
selenium.headless=true
selenium.remote=false
selenium.grid.url=http://localhost:4444/wd/hub
selenium.implicit.wait=10
selenium.explicit.wait=15
selenium.page.load.timeout=30

# Application Under Test
app.base.url=https://www.saucedemo.com/

# Test Data
test.data.path=src/test/resources/testdata/
test.users.standard=standard_user
test.users.locked=locked_out_user
test.users.problem=problem_user
test.users.performance=performance_glitch_user
test.users.error=error_user
test.users.visual=visual_user
test.password=secret_sauce

# Reporting
reports.extent.enabled=true
reports.extent.path=extent-test-output/
reports.extent.override=true
reports.allure.enabled=true
reports.screenshot.on.failure=true
reports.screenshot.on.pass=false

# Logging
logging.level.root=INFO
logging.level.com.selcuk=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/automation.log

# Retry Configuration
test.retry.count=1
test.retry.enabled=false

# Parallel Execution
test.parallel.enabled=false
test.parallel.thread.count=3

# ELK Integration
elk.enabled=false
elk.url=http://localhost:9200
